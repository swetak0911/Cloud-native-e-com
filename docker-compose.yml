version: "3.9"

# Local development infrastructure for the e-commerce platform.
# Boot with:  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]

  auth-service:
    build: ./services/auth-service
    ports: ["4000:4000"]
    depends_on: [mongo]
    environment:
      MONGO_URL: mongodb://mongo:27017/auth
      PORT: 4000

  product-service:
    build: ./services/product-service
    ports: ["4001:4001"]
    depends_on: [mongo]
    environment:
      MONGO_URL: mongodb://mongo:27017/productdb
      PORT: 4001

  cart-service:
    build: ./services/cart-service
    ports: ["4002:4002"]
    depends_on: [mongo]
    environment:
      MONGO_URL: mongodb://mongo:27017/cartdb
      PORT: 4002

  order-service:
    build: ./services/order-service
    ports: ["4003:4003"]
    depends_on: [mongo]
    environment:
      MONGO_URL: mongodb://mongo:27017/orderdb
      PORT: 4003
  
  api-gateway:
    build: ./services/api-gateway
    ports: ["8080:8080"]
    depends_on: [auth-service, product-service, cart-service, order-service]
    environment:
      PORT: 8080

volumes:
  pgdata:
  mongodata: